name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12']
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1})'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-validation.txt
      - name: Install validation baseline
        run: python -m pip install -e '.[dev]' -c requirements-validation.txt
      - name: Dependency consistency
        run: python -m pip check
      - name: Python lint
        run: ruff check .
      - name: Unit and disposable MongoDB lifecycle tests
        env:
          HC_SEEDER_LOCAL_MONGODB_URI: mongodb://127.0.0.1:27017
        run: python -m unittest discover -s tests -v
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build image without publishing
        run: docker build -t hc-seeder:ci .
      - name: Image dry-run without network access
        run: docker run --rm --network none -v "$PWD/config:/etc/seeder:ro" hc-seeder:ci --config /etc/seeder/config.test.yaml --dry-run 2
      - name: Validate Compose with empty example credentials
        run: |
          cp .env.example .env
          docker compose config --quiet
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Scan source for secrets
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          skip-dirs: .git
          exit-code: '1'
