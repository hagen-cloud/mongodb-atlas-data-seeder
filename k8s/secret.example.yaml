# Connection URI shape only. Configure the real Secret through your secret source.
# If using a local manifest, copy to ignored k8s/secret.yaml and keep it private.
apiVersion: v1
kind: Secret
metadata:
  name: mongo-seeder-uri
  namespace: mongo-seeder
type: Opaque
stringData:
  uri: "mongodb+srv://<user>:<password>@<cluster-host>/?retryWrites=true&w=majority"
